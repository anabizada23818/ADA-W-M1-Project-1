<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat & Table Reservation</title>
</head>
<body>

    <header class="site-header">
        <h1>Canteen Seat Reservation</h1>
    </header>

    <main class="container">

        <!-- Filters & selection summary -->
        <section class="toolbar" aria-label="Seat filters">
            <div class="filter-group">
                <span class="filter-label">Filter Status:</span>
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="available">Available</button>
                <button class="filter-btn" data-filter="selected">Selected</button>
                <button class="filter-btn" data-filter="reserved">Reserved</button>
                <button class="filter-btn" data-filter="unavailable">Unavailable</button>
            </div>
            <output class="cart-summary" id="cart-summary">Selected Seats: 0 · Total: 0.00 AZN</output>
        </section>

        <!-- Seat cards, rendered from seats.js by basicLogic.js -->
        <section class="seats-grid" id="seats-container" aria-label="Seats"></section>

    </main>

    <footer>
        <p>&copy; 2026 Canteen Reservation System Mockup</p>
    </footer>

    <script src="seats.js" defer></script>
    <script src="data.js" defer></script>
    <script src="basicLogic.js" defer></script>
</body>
</html>
